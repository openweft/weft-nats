# weft-nats: the production broker of a weft-loom-server deployment.
#
# - No anonymous user: every client that is not loom-server's own nkey is
#   sent to loom-server's auth callout, which answers only for a per-VM
#   credential it minted and limits that VM to its own subjects.
# - The broker holds NO secret. It reads two PUBLIC keys from the file
#   mounted at /etc/weft-nats/keys.conf (see README); the seeds stay in
#   loom-server. Without that file the server refuses to start.
# - JetStream lives in /data, a 0700 directory.

server_name: weft-nats
listen: 0.0.0.0:4222

jetstream {
  store_dir: "/data"
}

# Defines LOOM_USER_KEY (U...) and CALLOUT_ISSUER_KEY (A...).
include "keys.conf"

accounts {
  WEFT {
    jetstream: enabled
    users: [ { nkey: $LOOM_USER_KEY } ]
  }
}

authorization {
  auth_callout {
    issuer: $CALLOUT_ISSUER_KEY
    auth_users: [ $LOOM_USER_KEY ]
    account: WEFT
  }
}
